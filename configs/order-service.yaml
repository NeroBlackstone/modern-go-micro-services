server:
  port: 8080
  mode: debug

database:
  host: postgres-order
  port: 5432
  user: bookstore
  password: bookstore123
  dbname: order_db
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 100

rabbitmq:
  host: rabbitmq
  port: 5672
  user: guest
  password: guest

jwt:
  secret: your-secret-key-change-in-production
  expire_hours: 72

kratos:
  public_url: "http://kratos:4433"
  admin_url: "http://kratos:4434"

service_auth:
  shared_secret: "${SERVICE_AUTH_SECRET}"
  service_name: "order-service"
  target_service: "book-service"
  ttl: "5m"

vault:
  addr: "${VAULT_ADDR}"
  kv_path: "${VAULT_KV_PATH}"
  enabled: true

tracing:
  endpoint: "tempo:4318"

log:
  level: info

consul:
  addr: consul:8500
