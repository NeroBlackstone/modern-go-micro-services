name: bookstore

services:
  # ==================== 基础设施服务 ====================

  # PostgreSQL - 用户数据库
  postgres-user:
    image: postgres:18-alpine
    container_name: bookstore-postgres-user
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore123
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - 图书数据库
  postgres-book:
    image: postgres:18-alpine
    container_name: bookstore-postgres-book
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore123
      POSTGRES_DB: book_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_book_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d book_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - 订单数据库
  postgres-order:
    image: postgres:18-alpine
    container_name: bookstore-postgres-order
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore123
      POSTGRES_DB: order_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:8-alpine
    container_name: bookstore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: bookstore-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Traefik API Gateway
  traefik:
    image: traefik:v3.7
    container_name: bookstore-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--log.level=INFO"
    ports:
      - "80:80" # HTTP 入口
      - "8080:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      consul:
        condition: service_healthy

  # Consul 服务发现
  consul:
    image: hashicorp/consul:2.0.1
    container_name: bookstore-consul
    ports:
      - "8500:8500" # Web UI + HTTP API
      - "8600:8600/udp" # DNS
    command: agent -dev -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 监控服务 ====================

  # Prometheus 指标监控
  prometheus:
    image: prom/prometheus:latest
    container_name: bookstore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./configs/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - user-service
      - book-service
      - order-service

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: bookstore-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ==================== 微服务 ====================

  # 用户服务 (gRPC :9091 + HTTP :8081)
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: user-service
    container_name: bookstore-user-service
    ports:
      - "9091:9091" # gRPC (内部通信 + 直连调试)
      # HTTP :8081 通过 Traefik 暴露，不再直接映射 host 端口
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/user`)"
      - "traefik.http.routers.user.entrypoints=web"
      - "traefik.http.services.user.loadbalancer.server.port=8081"
    environment:
      - GIN_MODE=debug
    depends_on:
      postgres-user:
        condition: service_healthy
      consul:
        condition: service_healthy

  # 图书服务 (gRPC :9092 + Metrics :9093)
  book-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: book-service
    container_name: bookstore-book-service
    ports:
      - "9092:9092" # gRPC
      - "9093:9093" # Prometheus metrics
    environment:
      - GIN_MODE=debug
    depends_on:
      postgres-book:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy

  # 订单服务 (HTTP :8080)
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: order-service
    container_name: bookstore-order-service
    # HTTP :8080 通过 Traefik 暴露，不再直接映射 host 端口
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.order.rule=PathPrefix(`/api/v1/orders`) || PathPrefix(`/api/v1/reviews`)"
      - "traefik.http.routers.order.entrypoints=web"
      - "traefik.http.services.order.loadbalancer.server.port=8080"
    environment:
      - GIN_MODE=debug
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
      user-service:
        condition: service_started
      book-service:
        condition: service_started

volumes:
  postgres_user_data:
  postgres_book_data:
  postgres_order_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
